<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zelos</title>
  <meta name="description" content="A local-first second brain. What needs you now, what you owe, what owes you, what is coming.">
  <!-- There is exactly one theme here, and it is black. Claiming "light dark"
       made the UA draw scrollbars, form controls and the caret in its light
       style whenever the OS was in light mode — pale furniture on a pure black
       page, which is the only part of the app the stylesheet cannot reach. -->
  <meta name="color-scheme" content="dark">
  <meta name="application-name" content="Zelos">
  <meta name="apple-mobile-web-app-title" content="Zelos">
  <meta name="theme-color" content="#212121">
  <link rel="icon" href="/assets/brand/zelos-icon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/assets/brand/zelos-favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/brand/zelos-icon-180.png" sizes="180x180">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/mail.css">
  <link rel="stylesheet" href="/life.css">
  <link rel="stylesheet" href="/documents.css">
  <link rel="stylesheet" href="/booking.css">
  <link rel="stylesheet" href="/shopping.css">
  <link rel="stylesheet" href="/meal-discovery.css">
  <link rel="stylesheet" href="/progress.css">
  <link rel="stylesheet" href="/finance.css">
  <link rel="stylesheet" href="/health.css">
  <link rel="stylesheet" href="/workspace.css">
  <link rel="stylesheet" href="/family.css">
  <link rel="stylesheet" href="/loading.css">
  <script src="/boot.js"></script>
</head>
<body>
  <div id="app">
    <div class="screen zelos-launch" role="status">
      <div class="zelos-launch-brand" aria-hidden="true">
        <span class="zelos-launch-mark"><span class="zelos-launch-wing zelos-launch-wing--left"><span class="zelos-wing-motion"><span class="zelos-feather zelos-feather--1"></span><span class="zelos-feather zelos-feather--2"></span><span class="zelos-feather zelos-feather--3"></span></span></span><span class="zelos-launch-wing zelos-launch-wing--right"><span class="zelos-wing-motion"><span class="zelos-feather zelos-feather--1"></span><span class="zelos-feather zelos-feather--2"></span><span class="zelos-feather zelos-feather--3"></span></span></span></span>
        <p class="zelos-launch-name"><span class="zelos-launch-letter">Z</span><span class="zelos-launch-letter">E</span><span class="zelos-launch-letter">L</span><span class="zelos-launch-letter">O</span><span class="zelos-launch-letter">S</span></p>
      </div>
      <p class="screen-line">Opening your workspace…</p>
    </div>
  </div>
  <noscript>
    <div class="screen">
      <p class="screen-mark">Zelos</p>
      <h1 class="screen-title">Zelos needs JavaScript</h1>
      <p class="screen-line">The board is built in the page from your own local database. There is no server-rendered fallback, and no CDN to load it from.</p>
    </div>
  </noscript>
  <script type="module" src="/app.js"></script>
</body>
</html>
