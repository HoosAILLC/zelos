name: unsigned desktop previews

# The Windows installer cannot be built on the machine Zelos is developed on:
# NSIS needs Wine, which is not there. This runs the build on real Windows and
# real macOS runners and attaches the results to the run, which is the whole
# reason the project has CI at all.
#
# Explicitly manual development previews. Public/tagged releases must use
# release.yml, which requires verified publisher signatures on every installer.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # Electron packaging is slow but not unbounded; a hang here costs real
    # minutes on a Windows runner.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64 installer
            platform: windows
            arch: x64
            target: win
            format: nsis
            script: dist:win
            out: 'desktop/dist/*setup-x64.exe'
          - os: windows-11-arm
            label: Windows ARM64 installer
            platform: windows
            arch: arm64
            target: win
            format: nsis
            script: dist:win
            out: 'desktop/dist/*setup-arm64.exe'
          - os: macos-15-intel
            label: macOS Intel disk image
            platform: macos
            arch: x64
            target: mac
            format: dmg
            script: dist:mac
            out: 'desktop/dist/*-x64.dmg'
          - os: macos-15
            label: macOS Apple Silicon disk image
            platform: macos
            arch: arm64
            target: mac
            format: dmg
            script: dist:mac
            out: 'desktop/dist/*-arm64.dmg'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify native build architecture
        run: node -e "if(process.arch !== '${{ matrix.arch }}') throw Error('Runner architecture does not match the installer under test')"

      - name: Verify release versions
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node -e 'const p=require("./package.json");const d=require("./desktop/package.json");if(process.env.GITHUB_REF_NAME!==`v${p.version}`||d.version!==p.version)throw Error("Release tag and app versions disagree")'

      - name: Install the core's pinned runtime dependencies
        run: npm ci --omit=dev --ignore-scripts

      # The shell has separate build-time dependencies.
      # No fallback after `npm ci`: the tracked lockfile is the pin an unsigned
      # build is trusted on, so a lockfile that no longer matches must fail the
      # build loudly here — not fall through to a fresh resolution that builds
      # green with the workflow log as the only trace.
      - name: Install the shell's build tools
        working-directory: desktop
        run: npm ci

      # The suite runs before anything is packaged: an installer built from a
      # failing tree is worse than no installer.
      - name: Run the suite
        shell: bash
        run: node --test --test-concurrency=4 --test-timeout=180000 test/*.test.mjs

      # The commit is stamped into the packaged app's package.json, where
      # desktop/main.js reads it for About and the "shell ready" log line —
      # without it every build is "Zelos <version>" and "which build do you
      # have?" has no answer. The whole sha, not the short one: a short sha
      # that happens to be all digits reaches electron-builder's argument
      # parser as a number; main.js shows the first seven.
      - name: Build
        working-directory: desktop
        # bash on both runners: PowerShell reads `-c.extraMetadata.commit=…` as the
        # parameter `-c` followed by a bare word, and electron-builder then went
        # looking for a config FILE named `.extraMetadata.commit=<sha>`. The suite
        # step above already runs under bash for the same family of reason.
        shell: bash
        run: npm run ${{ matrix.script }} -- --${{ matrix.arch }} -c.${{ matrix.target }}.target=${{ matrix.format }} -c.extraMetadata.commit=${{ github.sha }}
        env:
          # Unsigned on purpose. macOS builds are ad-hoc signed by the config
          # (identity "-"), Windows is unsigned; both are documented in
          # docs/INSTALL.md rather than papered over.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Check the packaged native runtime and first-run server
        run: node scripts/check-desktop.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-preview-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.out }}
          if-no-files-found: error
