name: desktop builds

# The Windows installer cannot be built on the machine Zelos is developed on:
# NSIS needs Wine, which is not there. This runs the build on real Windows and
# real macOS runners and attaches the results to the run, which is the whole
# reason the project has CI at all.
#
# Deliberately manual (and tag-triggered): these are 100 MB+ artifacts and there
# is no reason to build them on every push.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows installer
            script: dist:win
            out: 'desktop/dist/*setup*.exe'
          - os: macos-latest
            label: macos disk images
            script: dist:mac
            out: 'desktop/dist/*.dmg'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The app itself has no dependencies; the SHELL has two build-time ones.
      - name: Install the shell's build tools
        working-directory: desktop
        run: npm ci || npm install

      # The suite runs before anything is packaged: an installer built from a
      # failing tree is worse than no installer.
      - name: Run the suite
        shell: bash
        run: node --test test/*.test.mjs

      - name: Build
        working-directory: desktop
        run: npm run ${{ matrix.script }}
        env:
          # Unsigned on purpose. macOS builds are ad-hoc signed by the config
          # (identity "-"), Windows is unsigned; both are documented in
          # docs/INSTALL.md rather than papered over.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: zelos-${{ matrix.os }}
          path: ${{ matrix.out }}
          if-no-files-found: error
