name: tests

# The whole suite, on every platform Zelos claims to run on. It needs no
# install step: Zelos has no dependencies, so `actions/checkout` plus a Node
# runtime is the entire setup.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # A hung job is worse than a failing one: it burns minutes and reports
    # nothing. The suite takes well under a minute anywhere it is healthy.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The floor is 22.16, not 22.13: node:sqlite stops needing a flag at
        # 22.13 but is built WITHOUT FTS5 until 22.16, and Zelos's index needs
        # it. 23 is excluded on purpose — the whole line lacks FTS5, and this
        # matrix is what found that.
        node: ['22.16', '22', '24', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: No dependencies, by design
        shell: bash
        run: |
          test ! -d node_modules || { echo "node_modules exists — the zero-dependency claim is broken"; exit 1; }

      # Node's test runner has no glob of its own, so the files are listed.
      # Shell globbing does the expansion, which is why this is bash on every OS.
      #
      # --test-force-exit is deliberately NOT used here. It was added to stop a
      # Windows hang, and it stopped it — by aborting the process instead:
      # 'Assertion failed: !(handle->flags & UV_HANDLE_CLOSING), src\win\async.c'
      # on Node 22 and 24, a libuv teardown bug that newer Node has fixed. The
      # leaked handles it was papering over have since been closed properly, so
      # the flag has nothing left to do and one thing left to break.
      #
      # --test-timeout turns a test that blocks forever into a named failing
      # test instead of a job that sits silent until the runner is killed.
      #
      # Three minutes, not one. The AI-access scope matrix stands a server up
      # for every combination of scopes and hunts a planted string through each
      # one, which takes about ninety seconds on the slowest Windows runner and
      # a few on a Mac. This flag exists to catch a HANG, not to enforce a
      # performance budget, and 60s was an arbitrary number that turned the
      # slowest honest test in the suite into a red build.
      # The Windows legs are the only place the DPAPI backend is ever exercised
      # for real. test/secrets.test.mjs gates that one test on `win32` AND `CI`,
      # so a developer's own credential store is never written to; GitHub sets
      # CI=true for every step of every job, including through `shell: bash` on
      # Windows, so no `env:` entry is needed here and none should be added —
      # setting CI by hand elsewhere is exactly what that gate is guarding
      # against. If Windows ever stops detecting DPAPI and silently falls back
      # to the encrypted file, that test is what turns it red.
      - name: Run the suite
        shell: bash
        run: node --test --test-timeout=180000 test/*.test.mjs

      # The macOS legs let detection run for real, which is the point of them:
      # `CI` is set, so the two "this machine's real backend" tests use the
      # runner's own login keychain and write a throwaway item into it. This is
      # the assertion that they took it out again. Anything still filed under
      # Zelos's service name is a test that wrote into a credential store and
      # did not clean up — on a developer's machine that would be their keychain,
      # and nothing else in the suite can notice it.
      #
      # `find-generic-password` exits 0 only when it FINDS something, so 0 is
      # the failure here and 44 (not found) is the pass. The service name is
      # SERVICE in core/secrets.mjs; test/repo.test.mjs holds the two together,
      # because a renamed service would leave this step green and looking at
      # nothing.
      - name: The suite left nothing in the login keychain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if security find-generic-password -s com.zelos.app; then
            echo "the suite left a credential in the runner's login keychain"
            exit 1
          fi

  # --------------------------------------------------------------------
  # Linux, against a real Secret Service.
  #
  # The matrix above runs everything on ubuntu-latest, and that image has
  # neither `secret-tool` nor a keyring daemon. So detection falls to the
  # encrypted file, the two "real backend" tests see `encrypted-file` and return
  # quietly, and a green Ubuntu leg was equally consistent with libsecret
  # working and with libsecret never having been reached — the identical
  # vacuous pass that DPAPI_LIVE_ONLY closed on Windows. What went unverified
  # was libsecret's own conventions: whether `secret-tool` accepts the argv
  # core/secrets.mjs builds, whether a missing item is really exit 1, and
  # whether the value survives the newline convention on the way back.
  #
  # This is a job of its own rather than a step in the matrix because it needs a
  # session bus and an unlocked keyring, and because ONLY test/secrets.test.mjs
  # should run inside one: a live Secret Service under the whole suite would
  # hand every other file a real credential store to reach.
  libsecret:
    name: ubuntu · the real libsecret keyring
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Deliberately without --no-install-recommends. The keyring daemon's
      # secrets component pulls in pieces through recommends on some images, and
      # a leaner install that leaves the daemon half-there would show up as this
      # leg failing to detect libsecret — a red build about the packaging rather
      # than about Zelos.
      - name: Install a real Secret Service
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11

      # `dbus-run-session` gives the daemon a private session bus that dies with
      # the step, so nothing here can reach a bus anything else is using. The
      # keyring is created and unlocked with an empty password read from stdin:
      # this is a throwaway runner, and the alternative is a daemon that waits
      # for a prompt nobody is there to answer and a step that sits until the
      # timeout.
      #
      # ZELOS_LIBSECRET_LIVE is what test/secrets.test.mjs gates its live
      # round-trip on, and nothing else sets it. That is deliberate: on every
      # other leg the test skips out loud, naming what is missing, rather than
      # passing without having run. test/repo.test.mjs asserts this job and that
      # gate still name each other.
      #
      # The keyring check runs inside the SAME dbus-run-session as the suite. A
      # second invocation would get a fresh bus and an empty keyring, and would
      # be a step that always passes while looking like it proves something.
      - name: The libsecret round-trip, against the real secret-tool
        env:
          ZELOS_LIBSECRET_LIVE: '1'
        run: |
          dbus-run-session -- bash -c '
            set -e
            # --login, not --unlock. `--unlock` opens a login keyring that
            # already exists, and a fresh runner has none, so the daemon came up
            # with no default collection and secret-tool failed with "Object
            # does not exist at path /org/freedesktop/secrets/collection/login"
            # — a red build that looked like libsecret rejecting our argv when
            # it was this step never giving it anywhere to write. `--login`
            # creates the keyring from the password on stdin if it is missing.
            #
            # A password rather than an empty string: an empty one asks
            # gnome-keyring for an UNENCRYPTED keyring on some versions, which
            # prompts, and there is nobody here to answer. It is a throwaway
            # runner and this value protects nothing.
            mkdir -p "$HOME/.local/share/keyrings"
            eval "$(printf "zelos-ci\n" | gnome-keyring-daemon --daemonize --login)"
            export GNOME_KEYRING_CONTROL SSH_AUTH_SOCK
            eval "$(gnome-keyring-daemon --start --components=secrets)"
            export GNOME_KEYRING_CONTROL SSH_AUTH_SOCK
            # Prove the collection is really there before the suite runs, so a
            # bootstrap failure is reported as one instead of as every libsecret
            # assertion failing for its own apparent reason.
            secret-tool store --label=zelos-ci-probe service zelos-ci-probe key probe <<< "x"
            secret-tool clear service zelos-ci-probe key probe
            node --test --test-timeout=180000 test/secrets.test.mjs
            # Read the output, not the exit code: secret-tool `search` is
            # documented to exit 0 whether or not it matched anything, and a
            # check keyed on its status would be a check that always passes.
            leftovers="$(secret-tool search --all service com.zelos.app 2>/dev/null || true)"
            if [ -n "$leftovers" ]; then
              echo "the suite left credentials in the runner keyring:"
              echo "$leftovers"
              exit 1
            fi
          '
