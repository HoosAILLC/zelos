name: tests

# The whole suite, on every platform Zelos claims to run on. It needs no
# install step: Zelos has no dependencies, so `actions/checkout` plus a Node
# runtime is the entire setup.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # A hung job is worse than a failing one: it burns minutes and reports
    # nothing. The suite takes well under a minute anywhere it is healthy.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 22.13 is the real floor: node:sqlite stops needing a flag there.
        node: ['22.13', '24', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: No dependencies, by design
        shell: bash
        run: |
          test ! -d node_modules || { echo "node_modules exists — the zero-dependency claim is broken"; exit 1; }

      # Node's test runner has no glob of its own, so the files are listed.
      # Shell globbing does the expansion, which is why this is bash on every OS.
      #
      # --test-timeout matters more than it looks: without it a test that blocks
      # on a socket the platform will not refuse simply hangs, and the job
      # reports nothing at all until the runner is killed. With it, the hang
      # becomes a named failing test, which is the difference between a bug you
      # can fix and twenty minutes of silence.
      - name: Run the suite
        shell: bash
        run: node --test --test-timeout=60000 test/*.test.mjs
