name: tests

# The whole suite, on every platform Zelos claims to run on. It needs no
# install step: Zelos has no dependencies, so `actions/checkout` plus a Node
# runtime is the entire setup.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # A hung job is worse than a failing one: it burns minutes and reports
    # nothing. The suite takes well under a minute anywhere it is healthy.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The floor is 22.16, not 22.13: node:sqlite stops needing a flag at
        # 22.13 but is built WITHOUT FTS5 until 22.16, and Zelos's index needs
        # it. 23 is excluded on purpose — the whole line lacks FTS5, and this
        # matrix is what found that.
        node: ['22.16', '22', '24', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: No dependencies, by design
        shell: bash
        run: |
          test ! -d node_modules || { echo "node_modules exists — the zero-dependency claim is broken"; exit 1; }

      # Node's test runner has no glob of its own, so the files are listed.
      # Shell globbing does the expansion, which is why this is bash on every OS.
      #
      # --test-timeout turns a test that blocks forever into a named failing
      # test instead of a silent job. --test-force-exit covers the other half,
      # which is what actually bit here: every test can PASS and the runner
      # still hang, because one socket or server the suite opened is keeping
      # the event loop alive. That is a leak worth knowing about, but it is not
      # a reason for CI to sit for ten minutes and then report nothing.
      - name: Run the suite
        shell: bash
        run: node --test --test-timeout=60000 --test-force-exit test/*.test.mjs
